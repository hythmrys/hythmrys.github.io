<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}" dir="{% if page.lang == 'ar' %}rtl{% else %}ltr{% endif %}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }} — Haitham Alrayes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0a;--panel:#131313;--ink:#d8d8d8;--muted:#8f8f8f;--accent:#4db6ac;--accent2:#8fd4cb;--line:#232323;--radius:3px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);background-image:radial-gradient(#151515 1px, transparent 1px);background-size:22px 22px;
       color:var(--ink);line-height:1.75;
       font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  html[lang^="zh"] body{font-family:-apple-system,Segoe UI,Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
  html[lang="ar"] body{font-family:"Noto Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:0 20px}
  .postnav{padding:28px 0 0}
  .postnav a{color:var(--accent);text-decoration:none;font-family:Consolas,"Roboto Mono",monospace;font-size:.9rem}
  .postnav a:hover{text-decoration:underline}
  article{padding:32px 0 56px}
  h1{font-size:1.9rem;line-height:1.3}
  .meta{color:var(--muted);font-size:.85rem;margin:10px 0 28px;font-family:Consolas,"Roboto Mono",monospace}
  .langbadge{border:1px solid var(--line);background:var(--panel);color:var(--accent2);
             padding:1px 8px;border-radius:var(--radius);font-size:.78rem;margin-inline-start:8px}
  article h2{font-size:1.3rem;color:var(--accent);margin:34px 0 12px}
  article h3{font-size:1.05rem;margin:26px 0 10px}
  article p{margin-bottom:14px}
  article ul,article ol{margin:0 0 14px 22px}
  html[dir="rtl"] article ul,html[dir="rtl"] article ol{margin:0 22px 14px 0}
  article li{margin-bottom:6px}
  article a{color:var(--accent)}
  article code{background:var(--panel);border:1px solid var(--line);padding:1px 6px;border-radius:var(--radius);
               font-family:Consolas,"Roboto Mono",monospace;font-size:.88em;direction:ltr;unicode-bidi:embed}
  article pre{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
              padding:14px 16px;overflow-x:auto;margin-bottom:14px;direction:ltr;text-align:left}
  article pre code{border:none;padding:0;background:none}
  article blockquote{border-inline-start:3px solid var(--accent);padding-inline-start:14px;
                     color:var(--muted);margin-bottom:14px}
  article img{max-width:100%;border-radius:var(--radius)}
  article hr{border:none;border-top:1px solid var(--line);margin:28px 0}
  footer{padding:26px 0 44px;color:var(--muted);font-size:.85rem;text-align:center;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <div class="postnav"><a href="/blog/">{% if page.lang == 'ar' %}→ السجل{% elsif page.lang == 'zh' %}→ 返回日志{% else %}← back to log{% endif %}</a></div>
  <article>
    <h1>{{ page.title }}</h1>
    <div class="meta">{{ page.date | date: "%Y-%m-%d" }}<span class="langbadge">{{ page.lang | default: 'en' | upcase }}</span></div>
    {{ content }}
  </article>
  <footer>Haitham Alrayes · <a href="/" style="color:var(--accent)">home</a> · <a href="https://github.com/hythmrys" style="color:var(--accent)">GitHub</a></footer>
</div>
</body>
</html>
